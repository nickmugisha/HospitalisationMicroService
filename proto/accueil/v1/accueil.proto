syntax = "proto3";

package hospital.accueil.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service AccueilService {
  rpc CreatePatient(CreatePatientRequest) returns (PatientResponse);
  rpc GetPatient(GetPatientRequest) returns (PatientResponse);
  rpc SearchPatients(SearchPatientsRequest) returns (SearchPatientsResponse);
  rpc UpdatePatient(UpdatePatientRequest) returns (PatientResponse);
  rpc RegisterArrival(RegisterArrivalRequest) returns (ArrivalResponse);
  rpc OrientArrival(OrientArrivalRequest) returns (ArrivalResponse);
  rpc ListWaitingQueue(ListWaitingQueueRequest) returns (ListWaitingQueueResponse);
  rpc HealthCheck(hospital.common.v1.HealthRequest) returns (hospital.common.v1.HealthResponse);
}

enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_MALE = 1;
  SEX_FEMALE = 2;
  SEX_OTHER = 3;
}

enum PatientStatus {
  PATIENT_STATUS_UNSPECIFIED = 0;
  PATIENT_STATUS_ACTIVE = 1;
  PATIENT_STATUS_INACTIVE = 2;
  PATIENT_STATUS_DECEASED = 3;
}

enum ArrivalPriority {
  ARRIVAL_PRIORITY_UNSPECIFIED = 0;
  ARRIVAL_PRIORITY_ROUTINE = 1;
  ARRIVAL_PRIORITY_URGENT = 2;
  ARRIVAL_PRIORITY_EMERGENCY = 3;
}

enum ArrivalStatus {
  ARRIVAL_STATUS_UNSPECIFIED = 0;
  ARRIVAL_STATUS_WAITING = 1;
  ARRIVAL_STATUS_ORIENTED = 2;
  ARRIVAL_STATUS_CANCELLED = 3;
}

message Patient {
  string id = 1;
  string patient_number = 2;
  string first_name = 3;
  string last_name = 4;
  Sex sex = 5;
  string birth_date = 6; // YYYY-MM-DD
  string phone = 7;
  string address = 8;
  PatientStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreatePatientRequest {
  string first_name = 1;
  string last_name = 2;
  Sex sex = 3;
  string birth_date = 4;
  string phone = 5;
  string address = 6;
}

message GetPatientRequest {
  string patient_id = 1;
  string patient_number = 2;
}

message SearchPatientsRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message SearchPatientsResponse {
  repeated Patient patients = 1;
  int32 total = 2;
}

message UpdatePatientRequest {
  string patient_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional Sex sex = 4;
  optional string birth_date = 5;
  optional string phone = 6;
  optional string address = 7;
  optional PatientStatus status = 8;
}

message PatientResponse {
  Patient patient = 1;
}

message Arrival {
  string id = 1;
  string patient_id = 2;
  google.protobuf.Timestamp arrived_at = 3;
  string reason = 4;
  string target_service = 5;
  ArrivalPriority priority = 6;
  ArrivalStatus status = 7;
  string orientation_note = 8;
  google.protobuf.Timestamp oriented_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message RegisterArrivalRequest {
  string patient_id = 1;
  string reason = 2;
  string target_service = 3;
  ArrivalPriority priority = 4;
}

message OrientArrivalRequest {
  string arrival_id = 1;
  string target_service = 2;
  string orientation_note = 3;
}

message ArrivalResponse {
  Arrival arrival = 1;
}

message ListWaitingQueueRequest {
  string target_service = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message QueueEntry {
  Arrival arrival = 1;
  Patient patient = 2;
}

message ListWaitingQueueResponse {
  repeated QueueEntry entries = 1;
  int32 total = 2;
}
